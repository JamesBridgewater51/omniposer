# @package _global_
# ==============================================================================
# RICH Test Dataset Configuration
# ==============================================================================
# This config populates test_datasets at the global config level

test_datasets:
  - dataset:
      class_name: data_sets.dataset_rich.DatasetRICH
      preprocessed_dataset_root: datasets/RICH_smplx_preprocessed_test_split
      split: test
      datasets: 
        - 'Gym_010_cooking1'
        - 'Gym_010_dips1'
        - 'Gym_010_dips2'
        - 'Gym_010_lunge1'
        - 'Gym_010_lunge2'
        - 'Gym_010_mountainclimber1'
        - 'Gym_010_mountainclimber2'
        - 'Gym_010_pushup1'
        - 'Gym_010_pushup2'
        - 'Gym_011_burpee2'
        - 'Gym_011_cooking1'
        - 'Gym_011_cooking2'
        - 'Gym_011_dips1'
        - 'Gym_011_dips2'
        - 'Gym_011_dips3'
        - 'Gym_011_dips4'
        - 'Gym_011_pushup1'
        - 'Gym_011_pushup2'
        - 'Gym_012_cooking2'
        - 'Gym_012_lunge1'
        - 'Gym_012_lunge2'
        - 'Gym_012_pushup2'
        - 'Gym_013_burpee4'
        - 'Gym_013_dips1'
        - 'Gym_013_dips2'
        - 'Gym_013_dips3'
        - 'Gym_013_lunge1'
        - 'Gym_013_lunge2'
        - 'Gym_013_pushup1'
        - 'Gym_013_pushup2'
        - 'LectureHall_009_021_reparingprojector1'
        - 'LectureHall_009_sidebalancerun1'
        - 'LectureHall_010_plankjack1'
        - 'LectureHall_010_sidebalancerun1'
        - 'LectureHall_019_wipingchairs1'
        - 'LectureHall_021_plankjack1'
        - 'LectureHall_021_sidebalancerun1'
        - 'ParkingLot2_009_burpeejump1'
        - 'ParkingLot2_009_burpeejump2'
        - 'ParkingLot2_009_impro1'
        - 'ParkingLot2_009_impro2'
        - 'ParkingLot2_009_impro5'
        - 'ParkingLot2_009_overfence1'
        - 'ParkingLot2_009_overfence2'
        - 'ParkingLot2_009_spray1'
        - 'ParkingLot2_017_burpeejump1'
        - 'ParkingLot2_017_burpeejump2'
        - 'ParkingLot2_017_eating1'
        - 'ParkingLot2_017_overfence1'
        - 'ParkingLot2_017_overfence2'
        - 'ParkingLot2_017_pushup1'
        - 'ParkingLot2_017_pushup2'
      cano_jts_pos: false
      input_noise: false
      sep_noise: false
      noise_std_joint: 0.0
      noise_std_smplx_global_rot: 0.0
      noise_std_smplx_body_rot: 0.0
      noise_std_smplx_trans: 0.0
      noise_std_smplx_betas: 0.0
      load_noise: false
      align_to_yaxis: true
      clip_len: 33
      spacing: 2
      mean_std: false
      norm_strategy: meanstd
      norm_params_path: null
      slice_strategy: ${slice_strategy}
      # Motion-aware sampling parameters
      motion_weight_strategy: combined
      motion_weight_temperature: 1.0
      motion_weight_min: 0.1
      motion_fps: 30.0
      body_model_path: data/body_models/smplx_model
      joints_num: 22
      head_joint_idx: [15]
      torso_joint_idx: [12, 9, 6, 3]
      clip_percentiles: [1.0, 99.0]
      disable_cache: true
      logging_enabled: true
      use_ddp: false

# Dataset name for routing logic
dataset_name: rich
