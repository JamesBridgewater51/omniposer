    topology: smplx_22
    description: "COCO keypoints with estimated rotations. XYZ positions and rotations."
    modalities:
      local_positions:
        visible_ids: [0, 1, 2, 4, 5, 7, 8, 12, 15, 16, 17, 18, 19, 20, 21]
      R_world_joints:
        visible_ids: [0, 1, 2, 4, 5, 7, 8, 12, 15, 16, 17, 18, 19, 20, 21]
      R_root_joints:
        visible_ids: [0, 1, 2, 4, 5, 7, 8, 12, 15, 16, 17, 18, 19, 20, 21]
