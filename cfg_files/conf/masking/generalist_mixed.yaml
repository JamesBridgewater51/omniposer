# ==============================================================================
# Opt-in Generalist Mixed-Sensor Masking Configuration
# ==============================================================================

# Assign one masking action per sample while keeping tensor shapes fixed.
batch_policy: per_sample
same_batch_for_schedules: true
schedule_per_step: mixture

actions:
  - name: rohm_upper_body_xyz
    type: registry
    scheme: upper_body_with_root_xyz

  - name: egoego_head_xyz_rot
    type: registry
    scheme: egocentric_head_xyz_rot

  - name: imu_6_root_leaf_xyz_rot
    type: registry
    scheme: mocap_head_hands_feet_pelvis_xyz_rot

  - name: imu_5_leaf_xyz_rot
    type: registry
    scheme: mocap_head_hands_feet_xyz_rot

  - name: imu_head_hands_root_xyz_rot
    type: registry
    scheme: optitrack_rigid_body

  - name: imu_xsens_full_xyz_rot
    type: registry
    scheme: xsens_full

  - name: egoexo_prior
    type: custom
    scheme: egoexo_xyz
    fn: egoexo_like

  - name: random_joints_max15
    type: random_joint_visibility
    max_mask: 15

mixture:
  - until_step: null
    weights:
      rohm_upper_body_xyz: 1.0
      egoego_head_xyz_rot: 1.0
      imu_6_root_leaf_xyz_rot: 1.0
      imu_5_leaf_xyz_rot: 1.0
      imu_head_hands_root_xyz_rot: 1.0
      imu_xsens_full_xyz_rot: 1.0
      egoexo_prior: 1.0
      random_joints_max15: 1.0
