# ==============================================================================
# TrajNet Configuration - TCN (UNet TCN) Architecture (Discriminative)
# ==============================================================================

class_name: model.trajnet.TrajNet

# Core options
cano_jts_pos: false
use_masked_conditioner: true
abstract_model_type: discriminative

# Network configuration (architecture)
network_config:
  class_name: model.architectures.unet_tcn.UNetTCN
  mid_dim: 512
  time_dim: 32
  input_t: false
  generative_model_type: diffusion

# Frequency transform (disabled)
use_freq_transform: false
freq_config:
  method: band_gating
  num_bands: 4

# Loss weights
weight_loss_root_rec_repr: 1.0
weight_loss_root_pos_global: 100.0
weight_loss_root_vel_global: 1000.0
weight_loss_root_rot_vel_from_abs_traj: 1.0
weight_loss_root_smplx_transl_vel: 1000.0
weight_loss_root_smplx_rot_vel: 1.0
weight_loss_root_smooth: 1.0
weight_loss_root_rot_cos_smooth_from_abs_traj: 1.0

